<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Wedding Planner</title>
  <meta name="theme-color" content="#faf7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161413" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="login-icon" aria-hidden="true">💍</div>
      <h1>Wedding Planner</h1>
      <p class="muted">Masukkan PIN untuk membuka catatan keuangan.</p>
      <input id="pin" type="password" inputmode="text" autocomplete="current-password" placeholder="PIN" required>
      <button type="submit" class="btn primary block">Masuk</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span id="couple" class="couple"></span>
        <span id="countdown" class="countdown"></span>
      </div>
      <button id="refresh" class="icon-btn" type="button" aria-label="Muat ulang data" title="Muat ulang data">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </header>
    <div id="demo-banner" class="banner" hidden>
      <strong>Mode coba.</strong> Data hanya tersimpan di browser ini. Sambungkan ke Google Sheets agar tersimpan dan bisa dibuka berdua (lihat PANDUAN.md).
    </div>
    <nav class="tabs" aria-label="Menu">
      <button type="button" data-tab="ringkasan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Ringkasan
      </button>
      <button type="button" data-tab="tabungan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2M7 6V4h10v2"/></svg>Tabungan
      </button>
      <button type="button" data-tab="anggaran">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Anggaran
      </button>
      <button type="button" data-tab="pengaturan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Pengaturan
      </button>
    </nav>
    <main id="view"></main>
  </div>

  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <div id="busy" class="busy" hidden><span></span></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
